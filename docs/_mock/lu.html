Lobo:c=>par([[-.12,-.3],[-.34,-.92],[-.62,-.1]],c)+poly([[-.5,-.1],[-.45,.3],[-.16,.58],[0,.7],[.16,.58],[.45,.3],[.5,-.1],[.3,-.34],[-.3,-.34]],c)+par([[-.14,-.16],[-.34,-.06],[-.12,0]],D)+poly([[-.1,.5],[.1,.5],[0,.62]],D),
